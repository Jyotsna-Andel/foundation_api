# Local development services. Start: `docker compose up -d` (from the repo root).
# Credentials below are for local development only.
name: library

services:
  db:
    image: postgres:17-alpine
    container_name: library-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library_dev
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U library -d library_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
